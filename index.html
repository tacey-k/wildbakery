<style>
:root{
  --cream:#FBF5EA; --cream-2:#F3E8D6; --white:#FFFFFF;
  --choc:#2B1D14; --choc-2:#3D2A1C; --text:#2B1D14; --muted:#5F4E40;
  --gold:#E2A410; --gold-d:#B98205; --gold-soft:#FCEFC9; --rust:#B4532A;
  --line:rgba(43,29,20,.13);
  --serif:"Playfair Display", Georgia, "Times New Roman", serif;
  --sans:"DM Sans", "Helvetica Neue", Arial, sans-serif;
  --r:22px; --shadow:0 1px 2px rgba(43,29,20,.05),0 12px 30px -14px rgba(43,29,20,.22);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--text);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
[hidden]{display:none!important}
.wrap{max-width:1200px;margin:0 auto;padding:0 28px}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;margin:0;line-height:1.1;color:var(--choc)}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--rust)}
.eyebrow::before{content:"";width:22px;height:2px;background:currentColor}
section{scroll-margin-top:20px}
.sec{padding:96px 0}
.sec-head{margin-bottom:40px}
.sec-head h2{font-size:clamp(36px,4.6vw,58px);margin-top:12px}
.sec-head p{color:var(--muted);max-width:560px;margin:12px 0 0;font-size:18px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 28px;border-radius:999px;font-weight:700;font-size:16px;transition:background .2s,color .2s,transform .1s;text-align:center}
.btn:active{transform:translateY(1px)}
.btn-gold{background:var(--gold);color:var(--choc)}
.btn-gold:hover{background:#F0B21C}
.btn-dark{background:var(--choc);color:var(--cream)}
.btn-dark:hover{background:#000}
.btn-line{box-shadow:inset 0 0 0 2px currentColor}
.btn svg{width:20px;height:20px;flex:none}

/* top + header */
.topbar{background:var(--choc);color:var(--cream-2);font-size:14px}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;min-height:42px;gap:16px}
.topbar .r{display:flex;gap:16px;align-items:center}
.topbar a{display:inline-flex;align-items:center;gap:7px;font-weight:600}
.topbar .tel{color:var(--gold)}
.topbar svg{width:15px;height:15px}
.lang{display:inline-flex;border:1.5px solid rgba(251,245,234,.35);border-radius:999px;overflow:hidden}
.lang button{padding:3px 11px;font-size:12.5px;font-weight:700;color:var(--cream-2)}
.lang button.on{background:var(--gold);color:var(--choc)}
header.top{background:var(--cream);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:84px;gap:20px}
.brand img{height:58px;width:auto}
nav.main{display:flex;gap:4px}
nav.main a{font-weight:600;padding:10px 15px;border-radius:999px}
nav.main a:hover{background:var(--cream-2)}
.basket{display:inline-flex;align-items:center;gap:10px;height:50px;padding:0 8px 0 18px;border-radius:999px;background:var(--choc);color:var(--cream);font-weight:700}
.basket .n{display:grid;place-items:center;min-width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--choc);font-size:14px;padding:0 6px}

/* photo frame with graceful fallback */
.ph{position:relative;overflow:hidden;background:var(--choc-2)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .fb{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--cream-2);text-align:center;padding:20px}
.ph .fb img{position:static;width:auto;height:64px;opacity:.9}
.ph .fb span{font-family:var(--serif);font-style:italic;font-size:22px;opacity:.85}

/* hero */
.hero{padding:36px 0 0}
.hero-card{display:grid;grid-template-columns:1.1fr .9fr;background:var(--choc);border-radius:32px;overflow:hidden;min-height:580px}
.hero .copy{padding:68px 56px 60px 60px;display:flex;flex-direction:column;justify-content:center;color:var(--cream)}
.hero .eyebrow{color:var(--gold)}
.hero h1{color:var(--cream);font-size:clamp(46px,5.8vw,84px);margin:22px 0;letter-spacing:-.01em}
.hero h1 em{color:var(--gold)}
.bolt-word{display:inline-flex;align-items:baseline}
.bolt-word img{height:.8em;width:auto;margin:0 .02em;transform:translateY(.06em)}
.hero p{font-size:19px;color:rgba(251,245,234,.86);max-width:500px;margin:0 0 34px}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap}
.hero .cta .btn-line{color:var(--cream)}
.hero .ph{margin:16px;border-radius:24px;min-height:360px}

/* why */
.why-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.why-card{background:var(--white);border-radius:var(--r);padding:28px 24px;box-shadow:var(--shadow)}
.why-card .big{font-family:var(--serif);font-size:42px;font-weight:700;color:var(--gold-d);line-height:1;height:46px;display:flex;align-items:center}
.why-card .big img{height:42px;width:auto}
.why-card b{display:block;font-family:var(--serif);font-weight:600;font-size:20px;margin:14px 0 6px}
.why-card p{margin:0;color:var(--muted);font-size:15.5px;line-height:1.55}
.why-card.dark{background:var(--choc)}
.why-card.dark b{color:var(--cream)} .why-card.dark p{color:rgba(251,245,234,.75)}

/* menu */
.menu{background:var(--white);border-radius:40px;margin:0 16px;padding:90px 0}
.filters{display:inline-flex;gap:6px;background:var(--cream);padding:6px;border-radius:999px;margin-top:22px}
.filters button{padding:10px 22px;border-radius:999px;font-weight:700;font-size:15px;color:var(--muted)}
.filters button.on{background:var(--choc);color:var(--cream)}
.cat{margin-top:56px}
.cat-banner{border-radius:24px;height:220px;margin-bottom:10px}
.cat-banner::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(30,20,12,.82),rgba(30,20,12,.15) 70%)}
.cat-banner .lbl{position:absolute;left:34px;bottom:28px;z-index:2;color:var(--cream)}
.cat-banner h3{color:var(--cream);font-size:44px}
.cat-banner .lbl span{display:block;color:var(--gold);font-weight:700;font-size:14px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
.list{display:grid;grid-template-columns:1fr 1fr;column-gap:56px}
.item{display:grid;grid-template-columns:1fr auto;gap:8px 20px;padding:26px 0;border-bottom:1px solid var(--line);align-items:start}
.item .nm{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.item h4{font-size:24px}
.item .unit{font-size:14px;font-weight:600;color:var(--rust)}
.item .tag{font-size:12px;font-weight:700;background:var(--gold);color:var(--choc);padding:3px 10px;border-radius:999px;align-self:center}
.item .price{font-family:var(--serif);font-size:24px;font-weight:600;color:var(--choc);white-space:nowrap}
.item p{grid-column:1/2;margin:0;color:var(--muted);font-size:15.5px;line-height:1.55}
.item .act{grid-column:2/3;grid-row:2/3;align-self:end;justify-self:end}
.add{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;background:var(--choc);color:var(--cream);font-weight:700;font-size:15px;white-space:nowrap}
.add:hover{background:var(--gold);color:var(--choc)}
.add svg{width:16px;height:16px}
.stepper{display:inline-flex;align-items:center;gap:4px;height:44px;border-radius:999px;background:var(--gold);padding:0 4px}
.stepper button{width:36px;height:36px;border-radius:50%;background:var(--white);font-size:19px;font-weight:700;display:grid;place-items:center}
.stepper span{min-width:28px;text-align:center;font-weight:700}

/* order */
.order-grid{display:grid;grid-template-columns:1fr 1.15fr;gap:28px;align-items:start}
.panel{background:var(--white);border-radius:var(--r);box-shadow:var(--shadow);padding:30px}
.panel h3{font-size:28px;margin-bottom:6px}
.panel .sub{color:var(--muted);margin:0 0 18px;font-size:15.5px}
.line{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.line .nm{font-family:var(--serif);font-weight:600;font-size:19px;line-height:1.2}
.line .nm small{display:block;font-family:var(--sans);font-weight:500;font-size:13.5px;color:var(--muted)}
.line .amt{font-weight:700;min-width:70px;text-align:right}
.line .stepper{height:38px}.line .stepper button{width:30px;height:30px;font-size:17px}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding-top:16px}
.tot span:first-child{font-weight:700;color:var(--muted)}
.tot span:last-child{font-family:var(--serif);font-size:32px;font-weight:700}
.note{background:var(--gold-soft);border-radius:14px;padding:14px 16px;font-size:14.5px;margin-top:16px}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.empty b{display:block;font-family:var(--serif);font-size:24px;color:var(--choc);margin-bottom:6px}
.fs{margin-bottom:26px}
.fs .lt{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.fs .lt i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--gold);color:var(--choc);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.fs .lt b{font-family:var(--serif);font-weight:600;font-size:22px}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.f label,.flabel{font-size:14px;font-weight:700;color:var(--choc)}
.f label em,.flabel em{color:var(--rust);font-style:normal}
.f input,.f select,.f textarea{width:100%;min-width:0;font:inherit;font-size:16px;color:var(--text);background:var(--cream);border:2px solid transparent;border-radius:12px;padding:13px 14px;outline:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--gold);background:var(--white)}
.err{display:none;font-size:13.5px;color:#B23A1C;font-weight:600}
.bad .err{display:block}
.bad input,.bad select{border-color:#B23A1C;background:#FFF5F2}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.choice button{text-align:left;border:2px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--white)}
.choice button b{display:block;font-size:16.5px}
.choice button span{display:block;font-size:13.5px;color:var(--muted);line-height:1.4;margin-top:2px}
.choice button.on{border-color:var(--gold);background:var(--gold-soft)}
.check{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;color:var(--muted);line-height:1.55;cursor:pointer}
.check input{margin-top:4px;width:18px;height:18px;flex:none;accent-color:var(--choc)}
.formmsg{display:none;background:#FFF0EC;color:#9B2F15;border-radius:12px;padding:12px 14px;font-weight:600;font-size:14.5px;margin-bottom:14px}
.formmsg.on{display:block}
.done{text-align:center}
.done .seal{width:84px;height:84px;margin:0 auto 16px;border-radius:50%;background:var(--gold);display:grid;place-items:center}
.done .seal svg{width:38px;color:var(--choc)}
.done h3{font-size:34px}
.ordno{display:inline-block;margin:12px 0 18px;font-weight:700;letter-spacing:.1em;padding:7px 16px;border-radius:999px;background:var(--cream)}
.sendbox{background:var(--choc);color:var(--cream);text-align:left;border-radius:18px;padding:22px;margin:4px 0 16px}
.sendbox p{margin:0 0 14px;color:rgba(251,245,234,.88);font-size:15.5px}
.sendbox b{color:var(--gold)}
.sendbox .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sendbox .btn{min-height:48px;padding:0 12px;font-size:15px}
.sendbox .btn-line{color:var(--cream)}
.ordertext{width:100%;min-height:150px;margin-top:12px;border-radius:12px;border:0;padding:12px;font:13.5px/1.5 ui-monospace,Menlo,Consolas,monospace;background:rgba(251,245,234,.08);color:var(--cream);resize:vertical}
.copied{display:none;color:var(--gold);font-weight:700;font-size:14px;margin-top:8px}
.copied.on{display:block}

/* craft */
.craft-card{display:grid;grid-template-columns:1fr 1fr;background:var(--choc);border-radius:32px;overflow:hidden}
.craft-card .ph{min-height:460px}
.craft-card .copy{padding:64px 56px;color:var(--cream);display:flex;flex-direction:column;justify-content:center}
.craft-card .eyebrow{color:var(--gold)}
.craft-card h2{color:var(--cream);font-size:clamp(34px,4vw,52px);margin:14px 0 18px}
.craft-card p{color:rgba(251,245,234,.82);font-size:18px;margin:0 0 20px}
.craft-card ul{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.craft-card li{display:flex;gap:12px;align-items:center}
.craft-card li i{width:26px;height:26px;border-radius:50%;background:var(--gold);color:var(--choc);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px;flex:none}

/* where */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.box{background:var(--white);border-radius:var(--r);padding:36px;box-shadow:var(--shadow)}
.box h3{font-size:30px;margin-bottom:10px}
.box p{color:var(--muted);margin:0 0 18px}
.locs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.loc{border:2px solid var(--line);border-radius:14px;padding:14px 16px}
.loc b{display:block;font-family:var(--serif);font-size:20px}
.loc span{font-size:14px;color:var(--muted)}

/* faq */
.faq-wrap{display:grid;grid-template-columns:.8fr 1.2fr;gap:56px}
.qa{background:var(--white);border-radius:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(43,29,20,.07)}
.qa summary{list-style:none;cursor:pointer;padding:20px 24px;font-weight:700;font-size:17px;display:flex;justify-content:space-between;gap:18px;align-items:center}
.qa summary::-webkit-details-marker{display:none}
.qa summary::after{content:"+";flex:none;width:30px;height:30px;border-radius:50%;background:var(--gold-soft);color:var(--gold-d);display:grid;place-items:center;font-size:20px}
.qa[open] summary::after{content:"−";background:var(--gold);color:var(--choc)}
.qa p{margin:0;padding:0 24px 20px;color:var(--muted)}

/* soon */
.soon-card{background:var(--gold);border-radius:32px;padding:64px 56px;display:grid;grid-template-columns:1.3fr 1fr;gap:44px;align-items:center}
.soon-card .eyebrow{color:var(--choc)}
.soon-card h2{font-size:clamp(36px,4.6vw,60px);margin:14px 0 16px}
.soon-card p{font-size:18.5px;margin:0;color:var(--choc-2)}
.follow{display:grid;gap:12px}
.soc{display:flex;align-items:center;gap:16px;background:var(--choc);color:var(--cream);border-radius:18px;padding:18px 22px}
.soc:hover{background:#000}
.soc .ic{width:46px;height:46px;border-radius:14px;background:rgba(251,245,234,.12);display:grid;place-items:center;flex:none}
.soc svg{width:24px;height:24px}
.soc b{display:block;font-size:18px}
.soc small{font-size:14px;color:rgba(251,245,234,.7)}

footer{background:var(--choc);color:rgba(251,245,234,.75);padding:64px 0 34px;margin-top:96px}
footer .wrap{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:40px}
footer .logo{height:76px;width:auto;margin-bottom:14px}
footer h4{font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
footer p{margin:0 0 8px}
footer a:hover{color:var(--gold)}
footer .fine{grid-column:1/-1;border-top:1px solid rgba(251,245,234,.15);padding-top:20px;margin-top:20px;font-size:14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

@media (max-width:1000px){
  nav.main{display:none}
  .hero-card,.craft-card,.soon-card,.order-grid,.faq-wrap,.grid2{grid-template-columns:1fr}
  .why-grid{grid-template-columns:1fr 1fr}
  .list{grid-template-columns:1fr}
  .craft-card .ph{min-height:320px}
}
@media (max-width:600px){
  body{font-size:16px}
  .wrap{padding:0 18px}
  .topbar .msg{display:none}
  .topbar .wrap{justify-content:flex-end}
  .brand img{height:46px}
  header.top .wrap{height:70px}
  .basket .lbl{display:none}
  .hero .copy{padding:40px 24px 30px}
  .hero .ph{min-height:280px;margin:0 12px 12px}
  .why-grid,.two,.choice,.locs,.sendbox .row{grid-template-columns:1fr}
  .menu{margin:0;border-radius:28px;padding:64px 0}
  .cat-banner{height:170px}.cat-banner h3{font-size:34px}
  .item{grid-template-columns:1fr}
  .item .act{grid-column:1;grid-row:auto;justify-self:start}
  .craft-card .copy,.soon-card{padding:40px 24px}
  .panel,.box{padding:24px 20px}
  footer .wrap{grid-template-columns:1fr}
}
</style>
</head>

/* ===================== static text ===================== */
function applyStatic(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  document.querySelectorAll("[data-th]").forEach(el => el.innerHTML = t(el.dataset.th));
  document.querySelectorAll("[data-lang]").forEach(b => b.classList.toggle("on", b.dataset.lang===lang));
  document.getElementById("faqList").innerHTML = t("faq").map(([q,a],i)=>`<details class="qa"${i===0?" open":""}><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join("");
  document.querySelectorAll(".igSub").forEach(el=>el.textContent = SETTINGS.instagram ? t("ig_s") : t("ig_sub_soon"));
  document.querySelectorAll(".fbSub").forEach(el=>el.textContent = SETTINGS.facebook ? t("fb_s") : t("fb_sub_soon"));
}

/* ===================== menu ===================== */
function itemHTML(p){
  return `<div class="item">
    <div class="nm"><h4>${esc(p.name)}</h4>${p.unit?`<span class="unit">${esc(unitOf(p))}</span>`:""}${p.tag?`<span class="tag">${t("tag_"+p.tag)}</span>`:""}</div>
    <div class="price">${fmt(p.price)}</div>
    <p>${esc(p[lang])}</p>
    <div class="act">${cart[p.id] ? stepper(p.id) : `<button type="button" class="add" data-add="${p.id}">${PLUS}${t("add")}</button>`}</div>
  </div>`;
}
function renderMenu(){
  const cats = ["bread","sweets"].filter(k => filter==="all" || filter===k);
  document.getElementById("catalog").innerHTML = cats.map(k=>{
    const list = PRODUCTS.filter(p=>p.cat===k);
    return `<div class="cat" id="cat-${k}">
      <div class="ph cat-banner"><div class="fb"></div><img src="${BANNERS[k]}" alt="" onerror="this.remove()">
        <div class="lbl"><span>${list.length} ${t("items")}</span><h3>${t("cat_"+k)}</h3></div></div>
      <div class="list">${list.map(itemHTML).join("")}</div></div>`;
  }).join("");
  document.getElementById("menuTotal").textContent = `${count()} · ${fmt(subtotal())}`;
  document.getElementById("cartCount").textContent = count();
}

/* ===================== order area ===================== */
function minDate(){ const d=new Date(); d.setDate(d.getDate()+SETTINGS.leadDays); const z=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`; }
function field(id, label, req, type="text", extra=""){
  return `<div class="f${errors[id]?" bad":""}"><label for="${id}">${label}${req?" <em>*</em>":""}</label>
    <input id="${id}" data-field="${id}" type="${type}" value="${esc(form[id]||"")}" ${extra}><span class="err">${errors[id]||""}</span></div>`;
}
function cartHTML(){
  const ids = Object.keys(cart);
  if(!ids.length) return `<div class="empty"><b>${t("empty_b")}</b>${t("empty_p2")}<div style="margin-top:16px"><a class="btn btn-dark" href="#menu">${t("see_menu")}</a></div></div>`;
  return ids.map(id=>{ const p=byId[id]; return `<div class="line">
      <div class="nm">${esc(p.name)}<small>${p.unit?esc(unitOf(p))+" · ":""}${fmt(p.price)} ${t("each")}</small></div>
      ${stepper(id)}<div class="amt">${fmt(p.price*cart[id])}</div></div>`; }).join("")
    + `<div class="tot"><span>${t("est")}</span><span>${fmt(subtotal())}</span></div><div class="note">${t("nopay")}</div>`;
}
function formHTML(){
  const m = form.method;
  return `<div class="formmsg${Object.keys(errors).length?" on":""}" id="formMsg">${errors._items?t("need_items"):t("form_err")}</div>
  <div class="fs"><div class="lt"><i>1</i><b>${t("s1")}</b></div>
    ${field("name", t("name"), true, "text", 'autocomplete="name"')}
    <div class="two">${field("phone", t("phone"), true, "tel", 'autocomplete="tel" placeholder="613-555-0123"')}
      ${field("email", t("email")+" "+t("optional"), false, "email", 'autocomplete="email"')}</div></div>
  <div class="fs"><div class="lt"><i>2</i><b>${t("s2")}</b></div>
    <div class="choice">
      <button type="button" data-method="pickup" class="${m==="pickup"?"on":""}"><b>${t("pickup")}</b><span>${t("pickup_s")}</span></button>
      <button type="button" data-method="delivery" class="${m==="delivery"?"on":""}"><b>${t("delivery")}</b><span>${t("delivery_s")}</span></button>
    </div>
    ${m==="pickup" ? `<div class="flabel" style="margin-bottom:8px">${t("pick_loc")} <em>*</em></div>
      <div class="choice">
        <button type="button" data-spot="gatineau" class="${form.spot==="gatineau"?"on":""}"><b>Gatineau</b><span>${t("addr_sent")}</span></button>
        <button type="button" data-spot="downtown" class="${form.spot==="downtown"?"on":""}"><b>${t("downtown")}</b><span>${t("addr_sent")}</span></button>
      </div>` : `
      ${field("street", t("street"), true, "text", 'autocomplete="address-line1"')}
      <div class="two">${field("unit", t("unit"), false, "text", 'autocomplete="address-line2"')}${field("city", t("city"), true, "text", 'autocomplete="address-level2" placeholder="Ottawa, Gatineau…"')}</div>
      ${field("postal", t("postal"), true, "text", 'autocomplete="postal-code" placeholder="K1A 0B1" style="text-transform:uppercase"')}`}
    <div class="two">
      ${field("date", t("date"), true, "date", `min="${minDate()}"`)}
      <div class="f${errors.slot?" bad":""}"><label for="slot">${t("time")} <em>*</em></label>
        <select id="slot" data-field="slot"><option value="">${t("sel_time")}</option>${t("slots").map((s,i)=>`<option value="${i}" ${String(form.slot)===String(i)?"selected":""}>${esc(s)}</option>`).join("")}</select>
        <span class="err">${errors.slot||""}</span></div>
    </div></div>
  <div class="fs"><div class="lt"><i>3</i><b>${t("s3")}</b></div>
    <div class="f"><label for="notes">${t("notes")}</label><textarea id="notes" data-field="notes" rows="3" placeholder="${t("notes_ph")}">${esc(form.notes||"")}</textarea></div>
    <div class="${errors.agree?"bad":""}"><label class="check"><input type="checkbox" id="agree" data-field="agree" ${form.agree?"checked":""}><span>${t("agree")}</span></label><span class="err">${errors.agree||""}</span></div>
  </div>
  <button type="button" class="btn btn-gold" id="placeOrder" style="width:100%">${t("place")} · ${fmt(subtotal())}</button>
  <p style="text-align:center;color:var(--muted);font-size:14px;margin:12px 0 0">${t("nopay2")}</p>`;
}
function doneHTML(){
  const o = lastOrder, txt = orderText(o);
  const spot = o.spot==="downtown" ? t("downtown") : "Gatineau";
  return `<div class="panel done" style="max-width:720px;margin:0 auto">
    <div class="seal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h3>${o.sent ? t("done_ok") : t("done_almost")}</h3>
    <p style="color:var(--muted);margin:8px 0 0">${o.method==="pickup" ? t("pick_in")+" "+esc(spot) : t("del_word")} · <b>${prettyDate(o.date)}</b>, ${esc(t("slots")[o.slot].toLowerCase())}</p>
    <span class="ordno">${o.number}</span>
    ${o.sent ? `<p>${t("confirm_soon")}</p>` : `
    <div class="sendbox"><p><b>${t("last")}</b> ${t("last_p")} <b>${esc(SETTINGS.phone)}</b>.</p>
      <div class="row"><a class="btn btn-gold" href="sms:${SETTINGS.phoneIntl}?&body=${encodeURIComponent(txt)}">${t("text_order")}</a><button type="button" class="btn btn-line" id="copyOrder">${t("copy_order")}</button></div>
      <div class="copied" id="copiedMsg">${t("copied")}</div>
      <p style="margin:14px 0 0;font-size:13.5px">${t("text_hint")}</p>
      <textarea class="ordertext" readonly id="orderText">${esc(txt)}</textarea></div>`}
    <button type="button" class="btn btn-dark" id="newOrder">${t("new_order")}</button></div>`;
}
function renderOrder(){
  const area = document.getElementById("orderArea");
  if(lastOrder){ area.innerHTML = doneHTML(); return; }
  area.innerHTML = `<div class="order-grid">
    <div class="panel"><h3>${t("cart_h")}</h3><p class="sub">${t("cart_sub")}</p>${cartHTML()}</div>
    <div class="panel"><h3>${t("details_h")}</h3><p class="sub">${t("nopay")}</p>${formHTML()}</div></div>`;
}
function renderAll(){ renderMenu(); renderOrder(); }

/* ===================== order submit ===================== */
function validate(){
  errors = {};
  const v = k => String(form[k]||"").trim();
  if(!count()) errors._items = true;
  if(v("name").length<2) errors.name = t("e_name");
  if(v("phone").replace(/\D/g,"").length<10) errors.phone = t("e_phone");
  if(v("email") && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v("email"))) errors.email = t("e_email");
  if(form.method==="delivery"){
    if(v("street").length<4) errors.street = t("e_street");
    if(v("city").length<2) errors.city = t("e_city");
    if(!/^[ABCEGHJ-NPRSTVXY]\d[ABCEGHJ-NPRSTV-Z][ -]?\d[ABCEGHJ-NPRSTV-Z]\d$/i.test(v("postal"))) errors.postal = t("e_postal");
  }
  if(!v("date") || v("date") < minDate()) errors.date = t("e_date")+" "+minDate()+".";
  if(v("slot")==="") errors.slot = t("e_time");
  if(!form.agree) errors.agree = t("e_agree");
  return Object.keys(errors).length===0;
}
function placeOrder(){
  if(!validate()){ renderOrder(); document.getElementById("formMsg").scrollIntoView({behavior:"smooth",block:"center"}); return; }
  const now=new Date(), z=n=>String(n).padStart(2,"0");
  lastOrder = {
    number:"WB-"+String(now.getFullYear()).slice(2)+z(now.getMonth()+1)+z(now.getDate())+"-"+Math.random().toString(36).slice(2,6).toUpperCase(),
    lang, name:form.name.trim(), phone:form.phone.trim(), email:(form.email||"").trim(), method:form.method, spot:form.spot,
    address: form.method==="delivery" ? `${form.street.trim()}${form.unit?", "+form.unit.trim():""}, ${form.city.trim()} ${String(form.postal).toUpperCase().trim()}` : "",
    date:form.date, slot:+form.slot, notes:(form.notes||"").trim(),
    items:Object.entries(cart).map(([id,q])=>({id,q,total:+(byId[id].price*q).toFixed(2)})), total:+subtotal().toFixed(2), sent:false
  };
  const keep = {name:form.name,phone:form.phone,email:form.email,method:form.method,spot:form.spot,street:form.street,unit:form.unit,city:form.city,postal:form.postal};
  store.set("wild-contact", JSON.stringify(keep));
  const finish = () => { cart={}; save(); form = Object.assign({}, keep); renderAll(); document.getElementById("order").scrollIntoView({behavior:"smooth",block:"start"}); };
  if(SETTINGS.orderEndpoint){
    fetch(SETTINGS.orderEndpoint,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({_subject:"New pre-order "+lastOrder.number,message:orderText(lastOrder)})})
      .then(r=>{ lastOrder.sent=r.ok; finish(); }).catch(finish);
  } else finish();
}
function prettyDate(s,l=lang){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString(l==="fr"?"fr-CA":"en-CA",{weekday:"long",month:"long",day:"numeric"}); }
function orderText(o){
  const L=[`WILD BAKERY — PRE-ORDER ${o.number}`,"",`Name: ${o.name}`,`Phone: ${o.phone}`];
  if(o.email) L.push(`Email: ${o.email}`);
  L.push("", o.method==="pickup" ? `PICKUP — ${o.spot==="downtown"?"Downtown Ottawa":"Gatineau"}` : "DELIVERY", `When: ${prettyDate(o.date,"en")}, ${T.en.slots[o.slot]}`);
  if(o.address) L.push(`Address: ${o.address}`);
  L.push("", ...o.items.map(i=>{ const p=byId[i.id]; return `${i.q} x ${p.name}${p.unit?" ("+p.unit.en+")":""} — $${i.total.toFixed(2)}`; }), "", `Estimated total: $${o.total.toFixed(2)} (pay on ${o.method})`);
  if(o.notes) L.push(`Notes: ${o.notes}`);
  if(o.lang==="fr") L.push("(Customer prefers French)");
  return L.join("\n");
}

/* ===================== events ===================== */
document.addEventListener("click", e=>{
  const b = e.target.closest("button, a"); if(!b) return;
  const d = b.dataset;
  if(d.add){ cart[d.add]=1; save(); renderAll(); }
  else if(d.inc){ cart[d.inc]=Math.min(50,(cart[d.inc]||0)+1); save(); renderAll(); }
  else if(d.dec){ const q=(cart[d.dec]||0)-1; if(q>0) cart[d.dec]=q; else delete cart[d.dec]; save(); renderAll(); }
  else if(d.filter){ filter=d.filter; document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("on",x===b)); renderMenu(); }
  else if(d.lang){ lang=d.lang; store.set("wild-lang",lang); errors={}; applyStatic(); renderAll(); }
  else if(d.method){ form.method=d.method; renderOrder(); }
  else if(d.spot){ form.spot=d.spot; renderOrder(); }
  else if(b.id==="placeOrder") placeOrder();
  else if(b.id==="newOrder"){ lastOrder=null; errors={}; renderAll(); document.getElementById("menu").scrollIntoView({behavior:"smooth"}); }
  else if(b.id==="copyOrder"){
    const ta=document.getElementById("orderText"); const show=()=>document.getElementById("copiedMsg").classList.add("on");
    try{ navigator.clipboard.writeText(ta.value).then(show).catch(()=>{ ta.focus(); ta.select(); }); }catch(err){ ta.focus(); ta.select(); }
  }
  else if((b.classList.contains("ig") && !SETTINGS.instagram) || (b.classList.contains("fb") && !SETTINGS.facebook)){ e.preventDefault(); }
  else if(b.matches('a[href^="#"]')){
    const target=document.getElementById(b.getAttribute("href").slice(1));
    if(target){ e.preventDefault(); target.scrollIntoView({behavior:"smooth",block:"start"}); }
  }
});
document.addEventListener("input", e=>{
  const k = e.target.dataset && e.target.dataset.field; if(!k) return;
  form[k] = e.target.type==="checkbox" ? e.target.checked : e.target.value;
  if(errors[k]){ delete errors[k]; const f=e.target.closest(".bad"); if(f) f.classList.remove("bad"); }
});
document.addEventListener("change", e=>{ const k=e.target.dataset&&e.target.dataset.field; if(k){ form[k]= e.target.type==="checkbox"?e.target.checked:e.target.value; } });

document.querySelectorAll(".phoneTxt").forEach(el=>el.textContent=SETTINGS.phone);
document.querySelectorAll("a.tel").forEach(a=>a.href="tel:"+SETTINGS.phoneIntl);
if(SETTINGS.instagram) document.querySelectorAll("a.ig").forEach(a=>a.href=SETTINGS.instagram);
if(SETTINGS.facebook) document.querySelectorAll("a.fb").forEach(a=>a.href=SETTINGS.facebook);
document.getElementById("yr").textContent = new Date().getFullYear();
applyStatic(); renderAll();
</script>
</body>
</html>
