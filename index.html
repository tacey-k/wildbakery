<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our new website opens in early November | WILD BAKERY</title>
<meta name="description" content="Our bakery's new website opens in early November. Until then, order by phone or text.">
<style>
  :root {
    --bg: #2f2018;
    --ink: #f6ecda;
    --muted: #d3c2a8;
    --accent: #e5a93d;
    --line: #6b5240;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.25rem;
    line-height: 1.6;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    text-align: center;
  }
  main { width: 100%; max-width: 620px; }
  .brand { font-size: 1.3rem; font-style: italic; color: var(--muted); margin: 0 0 40px; }
  h1 {
    font-size: clamp(2.3rem, 8vw, 3.8rem);
    line-height: 1.12;
    margin: 0 auto 28px;
    font-weight: 700;
    text-wrap: balance;
  }
  .lead { margin: 0 auto 14px; max-width: 28em; text-wrap: pretty; }
  .date { color: var(--accent); font-weight: 700; }
  .contact {
    margin-top: 44px;
    padding-top: 32px;
    border-top: 1px dashed var(--line);
    display: grid;
    gap: 18px;
    font-size: 1.1rem;
  }
  .row { display: grid; gap: 2px; }
  .label { color: var(--muted); font-size: 1rem; }
  .row a, .row span.val { font-size: 1.2rem; }
  .social { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 28px; }
  a { color: var(--accent); font-weight: 700; text-underline-offset: 4px; }
  a:hover { color: var(--ink); }
  a:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; border-radius: 2px; }
  @media (max-width: 420px) { body { font-size: 1.15rem; } }
</style>
</head>
<body>
<main>
  <p class="brand">WILD BAKERY</p>
  <h1>Fresh from the oven, and soon online</h1>
  <p class="lead">Our new website opens in <span class="date">early November</span>.</p>
  <p class="lead">Until then, we're baking as usual. Call or message us to order, or stop by the bakery.</p>

  <div class="contact">
    <div class="row">
      <span class="label">Order by phone or email</span>
      <a href="tel:+10000000000">+1 436 818 4520</a>
    </div>
    <div class="row">
      <span class="label">Follow us</span>
      <div class="social">
        <a href="https://www.instagram.com/wildbakery_ca "target="_blank" rel="noopener">Instagram</a>
        <a href="https://www.facebook.com/share/19tTtNiVYr/?mibextid=wwXIfr” target="_blank" rel="noopener">Facebook</a>
      </div>
    </div>
  </div>
</main>
</body>
</html>
